<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Project</title>

    <script src="https://aframe.io/releases/1.0.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/jeromeetienne/AR.js/2.1.4/aframe/build/aframe-ar.js"></script>
    <script src="js/mqttws31.min.js"></script>
    <script>
      // Het model bestaat alleen uit eenvoudige vormen, zonder model-download.
      AFRAME.registerComponent("houten-sahur", {
        init: function () {
          const hout = "#ac6c30";
          const donker = "#673a1b";
          const vorm = (type, positie, schaal, kleur, parent = this.el, extra = {}) => {
            const el = document.createElement("a-" + type);
            el.setAttribute("position", positie);
            el.setAttribute("scale", schaal);
            el.setAttribute("color", kleur);
            el.setAttribute("roughness", "0.8");
            Object.entries(extra).forEach(([naam, waarde]) => el.setAttribute(naam, waarde));
            parent.appendChild(el);
            return el;
          };
          const bol = (p, s, c, parent) => vorm("sphere", p, s, c, parent, { radius: 1 });
          const staaf = (p, s, c, parent, extra) => vorm("cylinder", p, s, c, parent, { radius: 1, height: 1, ...extra });
          // Lange stam met afgeronde uiteinden, zoals in het voorbeeld.
          staaf("0 1.35 0", "0.31 1.55 0.27", hout);
          bol("0 2.125 0", "0.31 0.095 0.27", "#b97b3c");
          bol("0 0.575 0", "0.31 0.06 0.27", hout);
          // Dunne, licht onregelmatige houtstrepen rond het lijf.
          for (let i = 0; i < 22; i++) {
            const hoek = i * Math.PI * 2 / 22;
            const x = Math.sin(hoek) * 0.311;
            const z = Math.cos(hoek) * 0.271;
            const hoogte = 0.64 + (i % 3) * 0.06;
            const einde = z > 0.12 && Math.abs(x) < 0.25 ? 1.28 : 2.08;
            const lijn = document.createElement("a-entity");
            lijn.setAttribute("line", {
              start: { x, y: hoogte, z },
              end: { x: x * 0.985, y: einde, z: z * 1.005 },
              color: i % 2 ? "#8e5428" : "#c18949",
            });
            this.el.appendChild(lijn);
          }
          // Oogranden, grote oogbollen, bruine irissen en glanspuntjes.
          [-1, 1].forEach((kant) => {
            const x = kant * 0.14;
            bol(`${x} 1.79 0.245`, "0.139 0.165 0.07", donker);
            bol(`${x} 1.79 0.285`, "0.116 0.14 0.067", "#fff4d9");
            bol(`${x} 1.775 0.345`, "0.066 0.075 0.023", "#70401d");
            bol(`${x} 1.775 0.365`, "0.037 0.044 0.015", "#100b07");
            bol(`${x - 0.017} 1.8 0.38`, "0.013 0.016 0.008", "white");
            const wenkbrauw = bol(`${x} 1.975 0.255`, "0.132 0.038 0.038", "#482713");
            wenkbrauw.setAttribute("rotation", `0 0 ${kant * -13}`);
          });
          // Langere neus en één doorlopende gebogen lach op de stam.
          bol("0 1.63 0.29", "0.05 0.135 0.065", "#bd7b37");
          bol("0 1.555 0.35", "0.078 0.055 0.065", "#c38642");
          const lachPunten = [];
          for (let i = 0; i <= 32; i++) {
            const x = -0.21 + (i / 32) * 0.42;
            const y = 1.36 + 0.105 * Math.pow(x / 0.21, 2);
            const z = 0.27 * Math.sqrt(1 - Math.pow(x / 0.31, 2)) + 0.012;
            lachPunten.push(new THREE.Vector3(x, y, z));
          }
          const lach = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lachPunten), 48, 0.012, 8, false),
            new THREE.MeshStandardMaterial({ color: "#3a2010", roughness: 0.9 }),
          );
          this.el.setObject3D("lach", lach);
          // Alleen cilinders voor benen en voeten.
          [-1, 1].forEach((kant) => {
            const x = kant * 0.16;
            staaf(`${x} 0.32 0`, "0.05 0.52 0.05", hout);
            staaf(`${x} 0.055 0.065`, "0.055 0.2 0.055", hout, this.el,
              { rotation: "90 0 0" });
          });
          // Vrije arm met elleboog en eenvoudige vingers.
          staaf("0.38 1.16 0", "0.052 0.44 0.052", hout, this.el, { rotation: "0 0 15" });
          bol("0.435 0.95 0", "0.055 0.06 0.055", hout);
          staaf("0.43 0.77 0.025", "0.037 0.36 0.04", hout);
          bol("0.43 0.56 0.04", "0.065 0.09 0.04", hout);
          for (let i = 0; i < 4; i++) {
            bol(`${0.385 + i * 0.027} ${0.47 + Math.abs(i - 1) * 0.015} 0.05`,
              "0.016 0.075 0.021", hout);
          }
          // Knuppel aan de andere kant, met smalle greep en ronde kop.
          const arm = this.el.querySelector(".knuppel-arm");
          arm.setAttribute("position", "-0.33 1.35 0");
          staaf("-0.045 -0.19 0", "0.05 0.39 0.05", hout, arm, { rotation: "0 0 -14" });
          // Gebogen onderarm: de hand houdt de knuppel rechtop naast het hoofd.
          staaf("-0.16 -0.30 0.09", "0.04 0.28 0.04", hout, arm, { rotation: "45 0 50" });
          bol("-0.23 -0.23 0.18", "0.075 0.085 0.065", "#bb7a37", arm);
          const knuppel = document.createElement("a-entity");
          knuppel.setAttribute("position", "-0.23 -0.23 0.18");
          knuppel.setAttribute("rotation", "0 0 0");
          arm.appendChild(knuppel);
          staaf("0 -0.11 0", "0.027 0.38 0.027", donker, knuppel);
          vorm("cone", "0 0.31 0", "1 1 1", "#b97a37", knuppel,
            { "radius-bottom": 0.035, "radius-top": 0.085, height: 0.65 });
          bol("0 0.635 0", "0.085 0.07 0.085", "#b97a37", knuppel);
          for (let i = 0; i < 3; i++) {
            bol(`0.025 ${-0.06 + i * 0.05} 0.035`, "0.052 0.023 0.035", hout, knuppel);
          }
        },
      });
      AFRAME.registerComponent("bombardino", {
        init: function () {
          this.hud = document.getElementById("vraag-2");
          this.status = document.getElementById("kleur-status");
          this.buttons = [...this.hud.querySelectorAll("[data-kleur]")];
          this.volgorde = ["blauw", "rood", "geel", "groen"];
          this.kleuren = { rood: "#ef4444", blauw: "#3b82f6", groen: "#22c55e", geel: "#facc15" };
          this.actief = false;
          this.bommen = [];
          const deel = (parent, type, attrs) => {
            const el = document.createElement("a-" + type);
            Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
            parent.appendChild(el);
            return el;
          };
          this.vliegtuig = deel(this.el, "entity", {
            position: "0 1.2 -0.35",
            rotation: "-90 0 0",
          });
          const p = this.vliegtuig;
          // Krokodillijf met lange snuit, vleugels, staart en twee propellers.
          deel(p, "sphere", { scale: "0.24 0.18 0.65", color: "#527442" });
          deel(p, "box", { position: "0 -0.03 0.66", width: 0.38, height: 0.16, depth: 0.58, color: "#70944d" });
          deel(p, "box", { position: "0 -0.105 0.7", width: 0.39, height: 0.035, depth: 0.58, color: "#26391f" });
          deel(p, "box", { position: "0 -0.145 0.7", width: 0.37, height: 0.05, depth: 0.55, color: "#8aa35b" });
          deel(p, "box", { position: "0 0 -0.12", width: 1.9, height: 0.055, depth: 0.34, color: "#67765c" });
          deel(p, "box", { position: "0 0.03 -0.66", width: 0.72, height: 0.045, depth: 0.2, color: "#67765c" });
          deel(p, "box", { position: "0 0.19 -0.65", width: 0.045, height: 0.35, depth: 0.22, color: "#527442" });
          [-1, 1].forEach((kant) => {
            deel(p, "sphere", { position: `${kant * 0.15} 0.15 0.39`, radius: 0.1, color: "#8aaa59" });
            deel(p, "sphere", { position: `${kant * 0.15} 0.18 0.455`, radius: 0.06, color: "#fff1b8" });
            deel(p, "sphere", { position: `${kant * 0.15} 0.185 0.505`, radius: 0.026, color: "#172313" });
            for (let i = 0; i < 5; i++) {
              deel(p, "cone", { position: `${kant * 0.185} -0.09 ${0.49 + i * 0.095}`, rotation: "180 0 0", radiusBottom: 0.025, "radius-bottom": 0.025, "radius-top": 0, height: 0.065, color: "#fff3ce" });
            }
            deel(p, "cylinder", { position: `${kant * 0.59} 0 -0.03`, rotation: "90 0 0", radius: 0.1, height: 0.42, color: "#404d37" });
            const rotor = deel(p, "entity", { position: `${kant * 0.59} 0 0.2`, animation: "property: rotation; to: 0 0 360; dur: 250; easing: linear; loop: true" });
            deel(rotor, "box", { width: 0.035, height: 0.43, depth: 0.025, color: "#c5b68a" });
          });
          this.volgorde.forEach((kleur) => {
            const bom = deel(this.el, "entity", { visible: false });
            deel(bom, "sphere", { scale: "0.105 0.19 0.105", color: this.kleuren[kleur], shader: "flat" });
            deel(bom, "box", { position: "0 0.16 0", width: 0.26, height: 0.06, depth: 0.045, color: this.kleuren[kleur] });
            this.bommen.push(bom);
          });
          this.reset = () => {
            this.elapsed = 0;
            this.invoer = [];
            this.klaar = false;
            this.opgelost = false;
            this.bommen.forEach(bom => bom.setAttribute("visible", false));
            this.buttons.forEach(btn => { btn.disabled = true; });
            this.status.textContent = "Kijk naar de vier bommen en onthoud de kleurvolgorde.";
          };
          this.buttons.forEach(btn => btn.addEventListener("click", () => {
            if (!this.actief || !this.klaar || this.opgelost) return;
            this.invoer.push(btn.dataset.kleur);
            if (this.invoer.length < 4) {
              this.status.textContent = `${this.invoer.length} van 4 kleuren gekozen`;
              return;
            }
            if (this.invoer.every((kleur, i) => kleur === this.volgorde[i])) {
              this.opgelost = true;
              this.status.textContent = "Goed! Het nummer is 8";
              this.buttons.forEach(button => { button.disabled = true; });
            } else {
              this.invoer = [];
              this.status.textContent = "Nog niet goed. Kies opnieuw vier kleuren of bekijk de bommen opnieuw.";
            }
          }));
          this.hud.querySelector(".opnieuw").addEventListener("click", this.reset);
          this.el.addEventListener("markerFound", () => { this.actief = true; this.hud.hidden = false; });
          this.el.addEventListener("markerLost", () => { this.actief = false; this.hud.hidden = true; });
          this.reset();
        },
        tick: function (time, delta) {
          if (!this.actief || this.klaar) return;
          this.elapsed += Math.min(delta, 100);
          this.vliegtuig.object3D.position.y = 1.2 + Math.sin(this.elapsed / 400) * 0.035;
          this.bommen.forEach((bom, i) => {
            const fase = (this.elapsed - 800 - i * 1200) / 950;
            bom.object3D.visible = fase >= 0 && fase < 1;
            if (bom.object3D.visible) {
              bom.object3D.position.set(0, 1.05 - fase * fase, -0.1 + fase * 0.9);
              bom.object3D.rotation.z = fase * 0.3;
            }
          });
          if (this.elapsed >= 5400) {
            this.klaar = true;
            this.buttons.forEach(btn => { btn.disabled = false; });
            this.status.textContent = "Klik de vier kleuren in de volgorde waarin de bommen vielen.";
          }
        },
      });
      AFRAME.registerComponent("sahur-slagen", {
        init: function () {
          this.arm = this.el.querySelector(".knuppel-arm");
          this.model = this.el.querySelector("#sahur");
          this.knop = document.getElementById("sla-knop");
          this.status = document.getElementById("slag-status");
          this.actief = false;
          this.slagen = 0;
          this.swing = null;
          this.breekTijd = null;
          const materiaal = new THREE.MeshStandardMaterial({ color: "#ffc928", roughness: 0.65 });
          this.blok = new THREE.Group();
          this.blok.position.set(-0.56, 0.86, 0.36);
          this.blok.add(new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.44, 0.44), materiaal));
          const randen = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(0.445, 0.445, 0.445)),
            new THREE.LineBasicMaterial({ color: "#ac6700" }),
          );
          this.blok.add(randen);
          this.model.object3D.add(this.blok);
          this.vraagteken = document.createElement("a-text");
          this.vraagteken.setAttribute("value", "?");
          this.vraagteken.setAttribute("position", "-0.56 0.86 0.59");
          this.vraagteken.setAttribute("align", "center");
          this.vraagteken.setAttribute("color", "#fff9da");
          this.vraagteken.setAttribute("width", "2.5");
          this.model.appendChild(this.vraagteken);
          // Scheuren liggen op de voorkant en bovenkant van het blok.
          this.scheuren = [];
          for (let i = 0; i < 9; i++) {
            const x = -0.18 + i * 0.043;
            const punten = [
              new THREE.Vector3(x, 0.22, -0.1),
              new THREE.Vector3(x + 0.025, 0.224, 0.09),
              new THREE.Vector3(x - 0.015, 0.224, 0.224),
              new THREE.Vector3(x + 0.025, 0.08, 0.224),
              new THREE.Vector3(x - 0.02, -0.04, 0.224),
              new THREE.Vector3(x + 0.01, -0.19, 0.224),
            ];
            const scheur = new THREE.Mesh(
              new THREE.TubeGeometry(new THREE.CatmullRomCurve3(punten), 20, 0.005, 4, false),
              new THREE.MeshBasicMaterial({ color: "#53300d" }),
            );
            scheur.visible = false;
            this.blok.add(scheur);
            this.scheuren.push(scheur);
          }
          this.stukken = [];
          for (let i = 0; i < 16; i++) {
            const stuk = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), materiaal);
            stuk.visible = false;
            this.model.object3D.add(stuk);
            const hoek = i * Math.PI * 2 / 16;
            this.stukken.push({ mesh: stuk, vx: Math.cos(hoek) * (0.4 + i % 3 * 0.15), vy: 0.65 + i % 4 * 0.15, vz: Math.sin(hoek) * 0.65 });
          }
          this.getal = document.createElement("a-text");
          this.getal.setAttribute("value", "4");
          this.getal.setAttribute("position", "-0.56 0.94 0.62");
          this.getal.setAttribute("align", "center");
          this.getal.setAttribute("color", "#fff3a0");
          this.getal.setAttribute("width", "5");
          this.getal.setAttribute("visible", false);
          this.model.appendChild(this.getal);
          this.verplaatsKnop = (willekeurig = false) => {
            const viewport = window.visualViewport;
            const links = viewport ? viewport.offsetLeft : 0;
            const boven = viewport ? viewport.offsetTop : 0;
            const breedte = viewport ? viewport.width : window.innerWidth;
            const hoogte = viewport ? viewport.height : window.innerHeight;
            const marge = 16;
            const knopBreedte = this.knop.offsetWidth || 104;
            const knopHoogte = this.knop.offsetHeight || 64;
            const code = document.getElementById("code-formulier").getBoundingClientRect();
            const vraag = document.getElementById("vraag-1").getBoundingClientRect();
            const minX = links + marge;
            const maxX = links + breedte - knopBreedte - marge;
            const minY = Math.max(boven + marge, code.bottom + marge);
            const maxY = Math.min(boven + hoogte - marge, vraag.top - marge) - knopHoogte;
            // Bij een open toetsenbord of heel klein venster geen overlap forceren.
            this.ruimteVoorKnop = maxX >= minX && maxY >= minY;
            if (!this.ruimteVoorKnop) {
              this.knop.hidden = true;
              return;
            }
            const oudX = parseFloat(this.knop.style.left);
            const oudY = parseFloat(this.knop.style.top);
            // Markerherkenning en viewport-events mogen geen nieuwe plek loten.
            if (!willekeurig && Number.isFinite(oudX) && Number.isFinite(oudY)) {
              this.knop.style.left = `${Math.max(minX, Math.min(maxX, oudX))}px`;
              this.knop.style.top = `${Math.max(minY, Math.min(maxY, oudY))}px`;
              this.knop.hidden = !this.actief || this.slagen >= 10;
              return;
            }
            let beste, afstand = -1;
            for (let i = 0; i < 12; i++) {
              const x = minX + Math.random() * (maxX - minX);
              const y = minY + Math.random() * (maxY - minY);
              const d = Number.isFinite(oudX) ? Math.hypot(x - oudX, y - oudY) : 0;
              if (d > afstand) { beste = { x, y }; afstand = d; }
              if (d >= 110) break;
            }
            this.knop.style.left = `${beste.x}px`;
            this.knop.style.top = `${beste.y}px`;
            this.knop.hidden = !this.actief || this.slagen >= 10;
          };
          const updateKnop = () => {
            this.knop.disabled = !this.actief || this.swing !== null || this.slagen >= 10;
            this.knop.hidden = !this.actief || this.slagen >= 10 || this.ruimteVoorKnop === false;
          };
          this.updateKnop = updateKnop;
          this.knop.addEventListener("click", () => {
            if (!this.actief || this.swing !== null || this.slagen >= 10) return;
            this.swing = 0;
            this.geraakt = false;
            updateKnop();
            this.verplaatsKnop(true);
          });
          this.el.addEventListener("markerFound", () => {
            this.actief = true;
            document.getElementById("vraag-1").hidden = false;
            this.verplaatsKnop();
            updateKnop();
          });
          this.el.addEventListener("markerLost", () => {
            this.actief = false;
            document.getElementById("vraag-1").hidden = true;
            updateKnop();
          });
          this.bijVensterWijziging = () => {
            if (this.actief) this.verplaatsKnop();
          };
          window.addEventListener("resize", this.bijVensterWijziging);
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", this.bijVensterWijziging);
            window.visualViewport.addEventListener("scroll", this.bijVensterWijziging);
          }
          updateKnop();
        },
        remove: function () {
          window.removeEventListener("resize", this.bijVensterWijziging);
          if (window.visualViewport) {
            window.visualViewport.removeEventListener("resize", this.bijVensterWijziging);
            window.visualViewport.removeEventListener("scroll", this.bijVensterWijziging);
          }
        },
        tick: function (time, delta) {
          if (!this.actief) return;
          const dt = Math.min(delta, 50) / 1000;
          if (this.swing !== null) {
            this.swing += dt;
            const t = this.swing;
            const smooth = x => x * x * (3 - 2 * x);
            const hoek = t < 0.22 ? 1.8 * smooth(t / 0.22)
              : t < 0.3 ? 1.8 : 1.8 * (1 - smooth(Math.min(1, (t - 0.3) / 0.35)));
            this.arm.object3D.rotation.x = hoek;
            if (t >= 0.22 && !this.geraakt) {
              this.geraakt = true;
              this.slagen++;
              this.status.textContent = `${this.slagen} / 10 slagen`;
              this.scheuren.forEach((scheur, i) => { scheur.visible = i < this.slagen; });
              if (this.slagen === 10) {
                this.blok.visible = false;
                this.vraagteken.setAttribute("visible", false);
                this.getal.setAttribute("visible", true);
                this.breekTijd = 0;
                this.status.textContent = "Lucky block open! Je geheime getal is 4.";
                this.knop.textContent = "Gekraakt!";
                this.updateKnop();
              }
            }
            if (this.slagen < 10) {
              const schok = t >= 0.22 ? Math.sin((t - 0.22) * 65) * Math.exp(-(t - 0.22) * 12) * 0.055 : 0;
              this.blok.rotation.z = schok;
            }
            if (t >= 0.65) {
              this.swing = null;
              this.arm.object3D.rotation.x = 0;
              this.blok.rotation.z = 0;
              this.updateKnop();
            }
          }
          if (this.breekTijd !== null) {
            this.breekTijd += dt;
            const t = this.breekTijd;
            this.stukken.forEach(({ mesh, vx, vy, vz }) => {
              mesh.visible = t < 1.1;
              mesh.position.set(-0.56 + vx * t, 0.86 + vy * t - 1.8 * t * t, 0.36 + vz * t);
              mesh.rotation.set(t * vx * 8, t * 5, t * vz * 8);
              mesh.scale.setScalar(Math.max(0, 1 - t / 1.1));
            });
            if (t >= 1.1) this.breekTijd = null;
          }
        },
      });
    </script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      #vraag-1 {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(88%, 560px);
        box-sizing: border-box;
        padding: 16px 20px;
        border-radius: 16px;
        background: rgba(24, 16, 10, 0.9);
        color: white;
        font: 600 20px/1.4 system-ui, sans-serif;
        text-align: center;
        z-index: 1000;
        pointer-events: auto;
      }
      #sla-knop {
        position: fixed;
        z-index: 1003;
        width: 104px;
        height: 64px;
        padding: 12px;
        border: 0;
        border-radius: 12px;
        background: #ffc928;
        color: #352009;
        font: 800 22px system-ui, sans-serif;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #sla-knop:disabled { opacity: 0.6; cursor: default; }
      #sla-knop:active { transform: scale(0.94); }
      #slag-status { margin: 8px 0; }
      #vraag-1 strong {
        display: block;
        color: #ffd28a;
        margin-bottom: 4px;
      }
      #vraag-2 {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: min(92%, 480px);
        box-sizing: border-box;
        padding: 16px;
        border-radius: 16px;
        background: rgba(16, 28, 18, 0.94);
        color: white;
        font: 16px/1.4 system-ui, sans-serif;
        text-align: center;
        z-index: 1001;
      }
      #kleur-status { margin: 10px 0; }
      .kleur-keuzes { display: flex; justify-content: center; gap: 12px; }
      .kleur-keuzes button {
        width: 64px;
        height: 64px;
        border: 3px solid white;
        border-radius: 12px;
        cursor: pointer;
        color: white;
        font-weight: bold;
        text-shadow: 0 1px 3px black;
      }
      .kleur-keuzes button:disabled { opacity: 0.45; cursor: default; }
      .kleur-keuzes button:active { transform: scale(0.92); }
      .opnieuw { margin-top: 12px; padding: 8px 16px; border-radius: 8px; border: 0; cursor: pointer; }
      #code-formulier {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: min(92%, 480px);
        box-sizing: border-box;
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(18, 22, 30, 0.94);
        color: white;
        font: 16px/1.4 system-ui, sans-serif;
        text-align: center;
        z-index: 1002;
      }
      #code-formulier label { display: block; margin-bottom: 10px; }
      .code-invoer { display: flex; gap: 8px; }
      #geheime-code {
        flex: 1;
        min-width: 0;
        padding: 10px;
        border: 2px solid #c5cbd5;
        border-radius: 8px;
        font: inherit;
      }
      #code-formulier button {
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #ffd28a;
        color: #241809;
        font: inherit;
        font-weight: bold;
        cursor: pointer;
      }
      #code-resultaat { margin: 8px 0 0; }
      #code-resultaat:empty { display: none; }
    </style>
  </head>
  <body>
    <form id="code-formulier">
      <label for="geheime-code">Vind alle getallen en vul ze in de juiste volgorde in om de geheime code te kraken!</label>
      <div class="code-invoer">
        <input id="geheime-code" type="text" inputmode="numeric" autocomplete="off" placeholder="Geheime code" />
        <button type="submit">Check</button>
      </div>
      <p id="code-resultaat" role="status" aria-live="polite"></p>
      <p id="node-red-status" role="status" style="font-size:12px; margin:6px 0 0">Node-RED: verbinding controleren...</p>
    </form>
    <div id="vraag-1" hidden>
      <strong>Vraag 1</strong>
      Tik op de rondreizende SLA-knop om het lucky block te breken!
      <p id="slag-status" role="status" aria-live="polite">0 / 10 slagen</p>
    </div>
    <button id="sla-knop" type="button" aria-label="Sla op het lucky block" hidden>SLA!</button>
    <div id="vraag-2" hidden>
      <strong>Vraag 2: Bombardino Crocodilo</strong>
      <p id="kleur-status" role="status" aria-live="polite"></p>
      <div class="kleur-keuzes">
        <button type="button" data-kleur="rood" style="background: #ef4444" aria-label="Rood">Rood</button>
        <button type="button" data-kleur="blauw" style="background: #3b82f6" aria-label="Blauw">Blauw</button>
        <button type="button" data-kleur="groen" style="background: #22c55e" aria-label="Groen">Groen</button>
        <button type="button" data-kleur="geel" style="background: #facc15" aria-label="Geel">Geel</button>
      </div>
      <button type="button" class="opnieuw">Bommen opnieuw bekijken</button>
    </div>
    <a-scene
      embedded
      arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
    >
      <!-- Gestileerde houten Tung Tung Tung Sahur met bewegende knuppel. -->
      <a-marker id="marker-1" type="barcode" value="1" emitevents="true" sahur-slagen>
        <a-entity id="sahur" position="0 0.4 1.05" rotation="-90 0 0" houten-sahur>
          <a-entity class="knuppel-arm"></a-entity>
        </a-entity>
        <a-text
          value="TUNG TUNG TUNG SAHUR"
          position="0 0.01 0.8"
          rotation="-90 0 0"
          align="center"
          width="3"
          color="#ffffff"
        ></a-text>
      </a-marker>

      <a-marker id="marker-2" type="barcode" value="2" emitevents="true" bombardino></a-marker>

      <a-entity camera></a-entity>
    </a-scene>
    <script>
      // Getallen van marker 1 en 2, in markervolgorde. Breid uit bij nieuwe vragen.
      const GEHEIME_CODE = "48";
      const codeInput = document.getElementById("geheime-code");
      const codeResultaat = document.getElementById("code-resultaat");
      // Voor GitHub Pages: vervang dit door het HTTPS-adres van je Pi.
      const NODE_RED_URL = "http://iot08:1880";
      const nodeRedStatus = document.getElementById("node-red-status");
      let verstuurd = false;
      let versturen = false;
      function nodeRedBereikbaarViaHttps() {
        if (location.protocol === "https:" && new URL(NODE_RED_URL).protocol !== "https:") {
          nodeRedStatus.textContent = "Node-RED: stel een HTTPS-adres in voor gebruik vanaf deze HTTPS-website.";
          return false;
        }
        return true;
      }
      async function controleerNodeRed() {
        if (!nodeRedBereikbaarViaHttps()) return;
        try {
          const response = await fetch(NODE_RED_URL + "/puzzle-ar/status", {signal: AbortSignal.timeout(5000)});
          if (!response.ok) throw new Error();
          const status = await response.json();
          nodeRedStatus.textContent = status.mqttConnected ? "Node-RED en MQTT verbonden" : "Node-RED bereikbaar; MQTT nog niet verbonden";
        } catch {
          nodeRedStatus.textContent = "Node-RED niet bereikbaar. Controleer iot08:1880 en of de flow is gedeployed.";
        }
      }
      function nederlandseTimestamp(datum = new Date()) {
        const delen = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {
          timeZone: "Europe/Amsterdam",
          year: "numeric", month: "2-digit", day: "2-digit",
          hour: "2-digit", minute: "2-digit", second: "2-digit",
          hourCycle: "h23", timeZoneName: "longOffset",
        }).formatToParts(datum).map(deel => [deel.type, deel.value]));
        const offset = delen.timeZoneName.replace("GMT", "") || "+00:00";
        return `${delen.year}-${delen.month}-${delen.day}T${delen.hour}:${delen.minute}:${delen.second}${offset}`;
      }
      async function stuurNaarNodeRed() {
        if (verstuurd || versturen || !nodeRedBereikbaarViaHttps()) return;
        versturen = true;
        nodeRedStatus.textContent = "Antwoord naar Node-RED sturen...";
        try {
          // Formulierdata voorkomt een JSON-CORS-preflight voor dit verzoek.
          const response = await fetch(NODE_RED_URL + "/puzzle-ar", {
            method: "POST",
            body: new URLSearchParams({message: "pass", timestamp: nederlandseTimestamp()}),
            signal: AbortSignal.timeout(8000),
          });
          const result = await response.json();
          if (!response.ok || !result.ok) throw new Error(result.error || "Versturen mislukt");
          verstuurd = true;
          nodeRedStatus.textContent = "Node-RED heeft je antwoord geaccepteerd en aan MQTT doorgegeven.";
        } catch (error) {
          nodeRedStatus.textContent = "Niet verstuurd: " + error.message + ". Klik opnieuw op Check.";
        } finally {
          versturen = false;
        }
      }
      controleerNodeRed();
      document.getElementById("code-formulier").addEventListener("submit", (event) => {
        event.preventDefault();
        const code = codeInput.value.trim();
        if (!code) {
          codeResultaat.textContent = "Vul eerst de geheime code in.";
          codeResultaat.style.color = "#ffd28a";
          codeInput.focus();
          return;
        }
        const goed = code === GEHEIME_CODE;
        codeResultaat.textContent = goed ? "Goed! Je hebt de geheime code gevonden!" : "Deze code klopt nog niet. Probeer opnieuw.";
        codeResultaat.style.color = goed ? "#86efac" : "#fca5a5";
        if (goed) stuurNaarNodeRed();
      });
      codeInput.addEventListener("input", () => { codeResultaat.textContent = ""; });
    </script>
  </body>
</html>
